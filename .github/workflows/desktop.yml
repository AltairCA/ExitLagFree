name: desktop

# Builds the desktop app (with the bundled helper) for macOS, Windows and
# Linux and uploads each platform's packages as a "desktop-<OS>" artifact.
on:
  workflow_call:
    inputs:
      version:
        description: "Version string embedded in the build and package names"
        type: string
        required: true
      ref:
        description: "Git ref to build"
        type: string
        required: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  WAILS_VERSION: "v2.16.0"
  WINTUN_URL: "https://www.wintun.net/builds/wintun-0.14.1.zip"
  VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
          - os: ubuntu-24.04
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Windows installer tooling
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis >/dev/null; then choco install nsis -y --no-progress; fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build helper
        run: |
          LDFLAGS="-s -w -X github.com/AltairCA/ExitLagFree/internal/version.Version=${VERSION}"
          mkdir -p bin
          case "${{ runner.os }}" in
            macOS)
              GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o bin/helper-arm64 ./cmd/exitlag-helper
              GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o bin/helper-amd64 ./cmd/exitlag-helper
              lipo -create -output bin/exitlag-helper bin/helper-arm64 bin/helper-amd64 ;;
            Windows)
              CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o bin/exitlag-helper.exe ./cmd/exitlag-helper
              curl -fsSL -o wintun.zip "$WINTUN_URL"
              unzip -q wintun.zip
              cp wintun/bin/amd64/wintun.dll bin/ ;;
            Linux)
              CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o bin/exitlag-helper ./cmd/exitlag-helper ;;
          esac

      - name: Build desktop app
        working-directory: app
        run: |
          EXTRA=""
          [ "${{ runner.os }}" = "Linux" ] && EXTRA="-tags webkit2_41"
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA="-nsis"
            # Windows version resources need a numeric x.y.z: "v1.2.3" -> 1.2.3, nightlies -> 0.0.0.
            PRODUCT_VERSION=$(echo "${VERSION#v}" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            [[ "$PRODUCT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || PRODUCT_VERSION=0.0.0
            PRODUCT_VERSION="$PRODUCT_VERSION" node -e '
              const fs = require("fs");
              const j = JSON.parse(fs.readFileSync("wails.json", "utf8"));
              j.info.productVersion = process.env.PRODUCT_VERSION;
              fs.writeFileSync("wails.json", JSON.stringify(j, null, 2));'
          fi
          wails build -clean -platform ${{ matrix.platform }} $EXTRA \
            -ldflags "-X github.com/AltairCA/ExitLagFree/internal/version.Version=${VERSION}"

      - name: Package
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            macOS)
              cp bin/exitlag-helper app/build/bin/ExitLagFree.app/Contents/MacOS/
              ditto -c -k --keepParent app/build/bin/ExitLagFree.app "out/ExitLagFree-${VERSION}-macos-universal.zip" ;;
            Windows)
              # wails only warns when makensis is missing, so fail here instead of shipping without a setup.exe.
              test -f app/build/bin/ExitLagFree-amd64-installer.exe || { echo "NSIS installer was not built" >&2; exit 1; }
              cp app/build/bin/ExitLagFree-amd64-installer.exe "out/ExitLagFree-${VERSION}-windows-amd64-setup.exe"
              cp bin/exitlag-helper.exe bin/wintun.dll app/build/bin/
              (cd app/build/bin && 7z a "../../../out/ExitLagFree-${VERSION}-windows-amd64-portable.zip" ExitLagFree.exe exitlag-helper.exe wintun.dll) ;;
            Linux)
              chmod +x scripts/package-linux.sh
              scripts/package-linux.sh "$VERSION" app/build/bin/ExitLagFree bin/exitlag-helper app/build/appicon.png out ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error
