name: build

# Every push to master builds all artifacts, attaches them to the workflow
# run, and replaces the rolling "nightly" pre-release on the Releases page.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-master
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # Must start with a digit for dpkg and avoid "+", which GitHub rewrites in asset names.
      - id: v
        run: echo "version=0.0.0-nightly.${{ github.run_number }}.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    runs-on: ubuntu-latest
    env:
      ELF_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Stage files
        run: |
          mkdir -p upload
          # Raw node binaries stay in per-target build dirs; artifacts.json maps them to their release names.
          jq -r '.[] | select(.type == "Archive" or .type == "Checksum"
                   or (.type == "Binary" and (.name | startswith("exitlag-node-"))))
                 | "\(.path)\t\(.name)"' dist/artifacts.json |
            while IFS=$'\t' read -r src name; do cp "$src" "upload/$name"; done
          cp scripts/install.sh upload/
          ls -la upload
      - uses: actions/upload-artifact@v4
        with:
          name: node-and-helper
          path: upload/*
          if-no-files-found: error

  desktop:
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}

  docker:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}
      tags: nightly

  nightly:
    needs: [version, binaries, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish nightly pre-release
        run: |
          ls -la out
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly out/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes "Automated build of $GITHUB_SHA. Not a stable release."
