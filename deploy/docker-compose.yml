# ExitLagFree node in Docker. Before starting:
#   - set net.ipv4.ip_forward=1 on the host (the container can't)
#   - optionally `modprobe wireguard` on the host for kernel WireGuard
#   - open TCP 8443, UDP 51820 and UDP 51821 in your host and cloud firewalls
# Docs: https://altairca.github.io/ExitLagFree/node/docker
services:
  exitlag-node:
    image: ghcr.io/altairca/exitlagfree-node:latest
    container_name: exitlag-node
    restart: unless-stopped
    # The node manages a WireGuard interface and firewall rules on the host.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      ELF_PUBLIC_HOST: "203.0.113.10" # your VPS public IP or domain (required on first start)
      ELF_NAME: "my-node"
      # Only read on first start, when no config exists yet:
      # ELF_API_PORT: "8443"
      # ELF_WG_PORT: "51820"
      # ELF_PROBE_PORT: "51821"
      # ELF_SUBNET: "10.66.0.0/24"
      # ELF_MAX_DEVICES: "10"
      # ELF_EGRESS_ALLOWLIST: "155.133.224.0/19,162.254.192.0/21"
    volumes:
      - config:/etc/exitlag-node
      - data:/var/lib/exitlag-node

volumes:
  config:
  data:
